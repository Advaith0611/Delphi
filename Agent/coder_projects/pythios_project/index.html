<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower of Hanoi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Tower of Hanoi</h1>
        
        <div class="game-info">
            <div class="move-counter">Moves: <span id="move-count">0</span></div>
            <div class="optimal-moves">Optimal: 31</div>
        </div>
        
        <div class="game-area" id="game-area">
            <div class="peg" id="peg-0" data-peg="0">
                <div class="peg-base"></div>
                <div class="peg-rod"></div>
            </div>
            <div class="peg" id="peg-1" data-peg="1">
                <div class="peg-base"></div>
                <div class="peg-rod"></div>
            </div>
            <div class="peg" id="peg-2" data-peg="2">
                <div class="peg-base"></div>
                <div class="peg-rod"></div>
            </div>
        </div>
        
        <button class="reset-btn" id="reset-btn">Reset Game</button>
        
        <div class="instructions">
            Click a disk to select it, then click a peg to move it there.
        </div>
        
        <div class="win-message" id="win-message">
            <h2>Congratulations! You solved it in <span id="final-moves">0</span> moves!</h2>
            <button id="play-again">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
